<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accueil et Programme</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,Arial,sans-serif;color:var(--foreground);font-variant-numeric:tabular-nums}main{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}.phone{width:312px;max-width:100%;background:#141414;border-radius:23px;overflow:hidden;color:#fff}.surface,nav{background:#1f1f1f}.status,header,.metrics,.legend,nav,.daily,.ring,.day,.bars,.modes,.cards{display:flex;align-items:center;justify-content:space-between}.status{padding:14px 18px 7px;font-size:12px}.status span{font-size:10px}header{padding:10px 14px}h1,h2,p{margin:0}h1{font-size:22px;text-transform:uppercase;letter-spacing:-1px}h2{font-size:15px}.action{background:#383838;border-radius:50%;padding:8px;display:grid;place-items:center}.daily{height:303px;flex-direction:column;padding:10px 13px 13px}.daily h2{align-self:start}.metrics,.bars{width:100%}.metrics>div{text-align:center;flex:1}.ring{position:relative;width:147px;height:147px;flex:none!important;justify-content:center;flex-direction:column}.ring svg{position:absolute;inset:0;width:100%;height:100%}.ring b{font-size:28px}.strategy .ring b{font-size:21px;line-height:1.15;max-width:110px;text-align:center}.ring small,.metrics small,.bar small,.legend,.day small{display:block;color:#bbb;font-size:10px;margin-top:5px}.metrics strong{font-size:17px}.bar{text-align:center;width:30%;font-size:11px}.bar i{display:block;height:4px;background:linear-gradient(to right,#383838 28%,var(--c) 28%);margin:5px 0}.modes{background:#383838;border-radius:20px;font-size:10px}.modes span,.modes b{padding:8px 14px}.modes b{background:white;color:#141414;border-radius:20px}.body{padding:16px 12px}.cards{gap:7px;margin-top:12px}.card{background:#1f1f1f;border-radius:12px;padding:12px;flex:1}.card p{color:#bbb;font-size:10px;margin-top:5px}.chart{display:block;width:100%;height:45px}.strategy{height:219px;display:grid;justify-items:center;align-content:space-evenly}.strategy .ring{width:160px;height:160px}.legend{gap:12px}.legend span{display:flex;align-items:center;gap:4px}.weekly{height:339px;margin-top:12px;display:flex;flex-direction:column;justify-content:space-between}.week{display:flex;gap:4px;height:208px}.day{flex:1;flex-direction:column;gap:3px;font-size:9px}.day span{width:100%;text-align:center;border-radius:3px;display:grid;place-items:center;color:#141414}.kc{background:#689ffa;height:21px;border-radius:10px!important}.g{background:#5dba87;flex:8}.p{background:#ff8660;flex:5}.l{background:#ffd15e;flex:3}.tools{display:flex;gap:5px;flex-wrap:wrap;font-size:10px}.tools span{border:1px solid #383838;border-radius:12px;padding:5px 7px}.search{margin:8px 12px;background:#383838;padding:10px 12px;border-radius:24px;color:#ddd;display:flex;gap:9px;align-items:center;font-size:12px}.search svg:last-child{margin-left:auto}nav{padding:10px 8px 15px}nav div{min-width:42px;text-align:center;color:#aaa;font-size:9px}nav svg{display:block;margin:0 auto 4px}.active{color:white}.add{background:white;color:#141414;padding:6px;border-radius:50%}.phone{display:flex;flex-direction:column}.body{flex:1}.phone{align-self:flex-start}.glyph{width:18px;height:18px}
</style><main></main><script>
const paths={accueil:'<path d="M3 3h7v11H3zM14 3h7v6h-7zM3 18h7v3H3zM14 13h7v8h-7z"/>',journal:'<path d="M12 8c-4-3-9-1-8 4 1 5 4 9 6 8l2-1 2 1c3 1 6-4 6-8 0-5-5-7-8-4Zm0-2C10 3 8 2 6 3c1 3 3 4 6 3Zm0 2 2-5"/>',plus:'<path d="M12 5v14M5 12h14"/>',programme:'<circle cx="12" cy="6" r="3.3"/><circle cx="6" cy="17" r="3.3"/><circle cx="18" cy="17" r="3.3"/>',profil:'<circle cx="12" cy="12" r="9.5"/><path d="M7 12h.5m4.2 0h.5m4.2 0h.5"/>',reglage:'<path d="M3 6h8m4 0h6M3 12h3m4 0h11M3 18h11m4 0h3M12 3v6M8 9v6m8 0v6"/>',menu:'<path d="M12 5h.1m-.1 7h.1m-.1 7h.1"/>',loupe:'<circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/>',scan:'<path d="M2 8V4h4m12 0h4v4M2 16v4h4m12 0h4v-4M7 7v10m3-10v10m4-10v10m3-10v10"/>',objectif:'<path d="M15 4a9 9 0 1 1-6 0m3 0v8m-4-4a5 5 0 1 0 8 1"/>',bilan:'<path d="M3 5h18v16H3zM3 9h18M7 3v4m10-4v4"/><circle cx="14" cy="15" r="2"/>'};
function icon(k,fill=false){return '<svg class="glyph" viewBox="0 0 24 24" fill="'+(fill?'currentColor':'none')+'" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+paths[k]+'</svg>'}
function ring(pro){return '<div class="ring"><svg viewBox="0 0 160 160" fill="none" stroke-linecap="round">'+(pro?'<circle cx="80" cy="80" r="72" stroke="#383838" stroke-width="4"/><circle cx="80" cy="80" r="72" stroke="#5dba87" stroke-width="4" stroke-dasharray="115 453"/><circle cx="80" cy="80" r="62" stroke="#383838" stroke-width="4"/><circle cx="80" cy="80" r="62" stroke="white" stroke-width="4" stroke-dasharray="255 390"/>':'<path d="M28 132a72 72 0 1 1 104 0" stroke="#383838" stroke-width="4"/><path d="M28 132a72 72 0 1 1 104 0" pathLength="100" stroke-dasharray="65.5 100" stroke-dashoffset="-34.5" stroke="#689ffa" stroke-width="4"/>')+'</svg><b>'+(pro?'3 JOURS':'1 251')+'</b><small>'+(pro?'avant le bilan':'restantes')+'</small></div>'}
const home='<section class="daily"><h2>Nutrition du jour</h2><div class="metrics"><div><strong>660</strong><small>Mangées</small></div>'+ring(false)+'<div><strong>1 911</strong><small>Objectif</small></div></div><div class="bars">'+[['Glucides','#5dba87','166 / 224'],['Protéines','#ff8660','80 / 156'],['Lipides','#ffd15e','31 / 43']].map(([n,c,v])=>'<div class="bar" style="--c:'+c+'"><small>'+n+'</small><i></i>'+v+' g</div>').join('')+'</div><div class="modes"><span>Mangé</span><b>Restant</b></div></section>';
const strategy='<div class="strategy">'+ring(true)+'<div class="legend"><span>'+icon('objectif')+' Objectif</span><span>'+icon('bilan')+' Bilan</span></div></div>';
const charts='<h2>Tendances</h2><div class="cards">'+[['Dépense','2 356 kcal','#ff8660','12 11 14 17 18 20 22'],['Poids tendance','70,2 kg','#b49ad8','16 16 17 16 16 17 16']].map(([n,v,c,ys])=>'<div class="card">'+n+'<p>7 derniers jours</p><svg class="chart" viewBox="0 0 104 32"><polyline fill="none" stroke="'+c+'" stroke-width="2" points="'+ys.split(' ').map((y,i)=>i*16+3+','+y).join(' ')+'"/></svg><b>'+v+'</b></div>').join('')+'</div>';
const weekly='<h2>En cours</h2><div class="card weekly"><div>Programme coaché<p>Depuis le 14 novembre</p></div><div class="week">'+[...'LMMJVSD'].map(d=>'<div class="day"><span class="kc">1911</span><span class="g">224 G</span><span class="p">156 P</span><span class="l">43 L</span><small>'+d+'</small></div>').join('')+'</div><div class="tools"><span>Nouveau programme</span><span>Modifier</span><span>Exception</span></div></div>';
document.querySelector('main').innerHTML=['Accueil','Programme'].map((name,i)=>'<article class="phone"><div class="surface"><div class="status">09:26<span>5G ▰</span></div><header><h1>'+name+'</h1><span class="action">'+icon(i?'menu':'reglage')+'</span></header>'+(i?strategy:home)+'</div><section class="body">'+(i?weekly:charts)+'</section><div class="search">'+icon('loupe')+'Rechercher un aliment'+icon('scan')+'</div><nav>'+['Accueil','Journal','plus','Programme','Profil'].map((s,j)=>s==='plus'?'<span class="add">'+icon(s)+'</span>':'<div class="'+(s===name?'active':'')+'">'+icon(s.toLowerCase(),s===name)+s+'</div>').join('')+'</nav></article>').join('');
</script></html>
